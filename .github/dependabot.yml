version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # Diese Toolchain-Wechsel benötigen jeweils einen eigenen Upgrade-Auftrag.
      # update-types betrifft nur Versions-, nicht Sicherheitsupdates.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@hey-api/openapi-ts"
        update-types:
          - version-update:semver-minor
    commit-message:
      prefix: deps

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    groups:
      kotlin-plugins:
        applies-to: version-updates
        patterns:
          - jvm
          - plugin.spring
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Zurich
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      MAILPIT_EXTERNAL_URL: http://127.0.0.1:18025
      POSTGRES_EXTERNAL_URL: jdbc:postgresql://127.0.0.1:55432/waste_app
    services:
      mailpit:
        image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
        ports:
          - 11025:1025
          - 18025:8025
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: waste_app
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: waste_app
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U waste_app -d waste_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Java einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties
          distribution: temurin
          java-version: "21"

      - name: pnpm über Corepack aktivieren
        run: corepack enable

      - name: Abhängigkeiten reproduzierbar installieren
        run: pnpm install --frozen-lockfile

      - name: Chromium für Browsertests installieren
        run: pnpm exec playwright install --with-deps chromium

      - name: Formatierung prüfen
        run: pnpm format:check

      - name: Linting prüfen
        run: pnpm lint

      - name: Typen prüfen
        run: pnpm typecheck

      - name: Tests ausführen
        run: pnpm test

      - name: Browser und Barrierefreiheit prüfen
        run: pnpm test:browser

      - name: Produktionsartefakte bauen
        run: pnpm build

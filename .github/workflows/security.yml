name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: pnpm über Corepack aktivieren
        run: corepack enable

      - name: NPM-Advisories prüfen
        run: pnpm security:audit

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      CI: "true"
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Java einrichten
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            gradle/wrapper/gradle-wrapper.properties
          distribution: temurin
          java-version: "21"

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: javascript-typescript,java-kotlin

      - name: pnpm über Corepack aktivieren
        run: corepack enable

      - name: Abhängigkeiten reproduzierbar installieren
        run: pnpm install --frozen-lockfile

      - name: Anwendung für CodeQL bauen
        run: pnpm build

      - name: CodeQL-Ergebnisse auswerten
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

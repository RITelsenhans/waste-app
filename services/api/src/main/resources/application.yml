spring:
  application:
    name: abfall-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55432/waste_app}
    username: ${SPRING_DATASOURCE_USERNAME:waste_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

waste:
  pilot:
    admin-enabled: ${WASTE_PILOT_ADMIN_ENABLED:true}
    allowed-origins:
      - ${WASTE_WEB_ORIGIN:http://localhost:3000}
      - ${WASTE_ADMIN_ORIGIN:http://localhost:3001}
  tenants:
    demo:
      tenant-id: demo
      name: Demo Kommune
      short-name: Demo
      branding:
        logo-url: /regio-it-logo.png
        primary-color: "#C8102E"
        info-color: "#008F8C"
      timezone: Europe/Berlin
      locales:
        - de-DE
      enabled-features:
        home: true
        demoPreview: true
        calendar: true
        wasteGuide: true
        sites: true
        notices: true
        defectCases: true
        bulkWaste: true
      legal-links:
        imprint: "#impressum"
        privacy: "#datenschutz"
        accessibility: "#barrierefreiheit"
      support-contacts:
        - label: Demo-Support
          email: support@example.invalid
      content-version: demo-2026-07-30

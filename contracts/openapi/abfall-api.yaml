openapi: 3.1.0
info:
  title: Abfall APP API
  version: 0.2.0
  description: Contract-first API für den synthetischen, lokal testbaren Phase-1/2-Piloten.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Aktueller API-Ursprung; konkrete Basis-URLs kommen aus der Laufzeitkonfiguration.
security: []
tags:
  - name: Health
    description: Technische Betriebsbereitschaft der API.
  - name: Tenants
    description: Öffentliche, mandantenspezifische Laufzeitkonfiguration.
  - name: Content
    description: Öffentliche Phase-1-Informationen des ausgewählten Mandanten.
  - name: Cases
    description: Synthetische Phase-2-Pilotvorgänge und Statuszugriff.
  - name: Admin
    description: Ausschließlich lokal aktivierte Pflege synthetischer Pilotdaten.
paths:
  /v1/health/ready:
    get:
      operationId: getReadiness
      summary: Prüft die Betriebsbereitschaft der API.
      tags:
        - Health
      responses:
        "200":
          description: Die API ist bereit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
              examples:
                ready:
                  $ref: "../examples/ready-response.json"
        "503":
          description: Die API oder eine zwingende Abhängigkeit ist nicht bereit.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Zu viele Anfragen.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/tenants:
    get:
      operationId: getMunicipalities
      summary: Listet alle öffentlich auswählbaren teilnehmenden Kommunen.
      tags: [Tenants]
      responses:
        "200":
          description: Alphabetische Kommunenliste.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MunicipalitySummary"
        "503":
          description: Kommunenverzeichnis ist vorübergehend nicht verfügbar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Zu viele Anfragen.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/tenants/{tenantKey}/config:
    get:
      operationId: getTenantConfig
      summary: Liefert die öffentliche Laufzeitkonfiguration eines Mandanten.
      tags:
        - Tenants
      parameters:
        - name: tenantKey
          in: path
          required: true
          description: Stabiler, öffentlicher Mandantenschlüssel.
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      responses:
        "200":
          description: Öffentliche Mandantenkonfiguration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantConfig"
              examples:
                demo:
                  $ref: "../examples/demo-tenant-config.json"
        "404":
          description: Der Mandant ist nicht konfiguriert.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/addresses/search:
    get:
      operationId: searchAddresses
      summary: Sucht belieferte Adressen eines Mandanten.
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        "200":
          description: Passende synthetische Adressen.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/addresses/{addressId}/collections:
    get:
      operationId: getCollections
      summary: Liefert kommende Abholtermine einer Adresse.
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AddressId"
      responses:
        "200":
          description: Chronologische Abholtermine.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionEvent"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/waste-guide/search:
    get:
      operationId: searchWasteGuide
      summary: Durchsucht das Abfall-ABC fehlertolerant nach Namen und Synonymen.
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 120
      responses:
        "200":
          description: Passende ABC-Einträge.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WasteGuideEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/sites:
    get:
      operationId: getSites
      summary: Listet Entsorgungsstandorte und optionale Abfallartfilter.
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: wasteType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Filterbare Standortliste.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/notices:
    get:
      operationId: getNotices
      summary: Liefert aktuell gültige Meldungen.
      tags: [Content]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: addressId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Aktive Meldungen nach Priorität.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notice"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/admin/collections:
    get:
      operationId: getAdminCollections
      summary: Listet alle synthetischen Abholtermine zur Pflege.
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/TenantId" }]
      responses:
        "200":
          description: Vollständige Terminliste.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollectionEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createCollection
      summary: Legt einen synthetischen Abholtermin an.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "201":
          description: Angelegter Termin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/admin/tenants/{tenantKey}:
    get:
      operationId: getAdminMunicipalityCustomization
      summary: Lädt das kommunale Customizing zur Pflege.
      tags: [Admin]
      parameters:
        - name: tenantKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Kommunales Customizing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MunicipalityCustomization"
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateAdminMunicipalityCustomization
      summary: Aktualisiert Namen, Kontaktwege und Farben einer Kommune.
      tags: [Admin]
      parameters:
        - name: tenantKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MunicipalityCustomizationInput"
      responses:
        "200":
          description: Aktualisiertes kommunales Customizing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MunicipalityCustomization"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/waste-guide:
    get:
      operationId: getAdminWasteGuide
      summary: Listet alle synthetischen ABC-Einträge zur Pflege.
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/TenantId" }]
      responses:
        "200":
          description: Vollständiges Abfall-ABC.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WasteGuideEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createWasteGuideEntry
      summary: Legt einen synthetischen ABC-Eintrag an.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WasteGuideInput"
      responses:
        "201":
          description: Angelegter ABC-Eintrag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WasteGuideEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/admin/sites:
    get:
      operationId: getAdminSites
      summary: Listet alle synthetischen Standorte zur Pflege.
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/TenantId" }]
      responses:
        "200":
          description: Vollständige Standortliste.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createSite
      summary: Legt einen synthetischen Entsorgungsstandort an.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: Angelegter Standort.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/admin/notices:
    get:
      operationId: getAdminNotices
      summary: Listet aktive, künftige und abgelaufene Hinweise zur Pflege.
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/TenantId" }]
      responses:
        "200":
          description: Vollständige Hinweisliste.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notice" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createNotice
      summary: Legt eine synthetische Meldung an.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeInput"
      responses:
        "201":
          description: Angelegte Meldung.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/admin/collections/{id}:
    put:
      operationId: updateCollection
      summary: Korrigiert einen synthetischen Abholtermin.
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/ContentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "200":
          description: Aktualisierter Termin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCollection
      summary: Löscht einen synthetischen Abholtermin.
      tags: [Admin]
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "204": { description: Termin gelöscht. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/waste-guide/{id}:
    put:
      operationId: updateWasteGuideEntry
      summary: Korrigiert einen synthetischen ABC-Eintrag.
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/ContentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WasteGuideInput" }
      responses:
        "200":
          description: Aktualisierter ABC-Eintrag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WasteGuideEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteWasteGuideEntry
      summary: Löscht einen synthetischen ABC-Eintrag.
      tags: [Admin]
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "204": { description: ABC-Eintrag gelöscht. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/sites/{id}:
    put:
      operationId: updateSite
      summary: Korrigiert einen synthetischen Standort.
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/ContentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteInput" }
      responses:
        "200":
          description: Aktualisierter Standort.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSite
      summary: Löscht einen synthetischen Standort.
      tags: [Admin]
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "204": { description: Standort gelöscht. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/admin/notices/{id}:
    put:
      operationId: updateNotice
      summary: Korrigiert einen synthetischen Hinweis.
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/ContentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoticeInput" }
      responses:
        "200":
          description: Aktualisierter Hinweis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteNotice
      summary: Löscht einen synthetischen Hinweis.
      tags: [Admin]
      parameters:
        - { $ref: "#/components/parameters/ContentId" }
        - { $ref: "#/components/parameters/TenantId" }
      responses:
        "204": { description: Hinweis gelöscht. }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/cases/defects:
    post:
      operationId: createDefectCase
      summary: Reicht eine synthetische Mängelmeldung idempotent ein.
      tags: [Cases]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefectCaseInput"
      responses:
        "201":
          description: Vorgang wurde angenommen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseCreated"
        "200":
          description: Bereits idempotent angelegter Vorgang.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/bulk-waste/rules:
    get:
      operationId: getBulkWasteRules
      summary: Liefert Kategorien, Mengenlimits und Bereitstellungshinweise.
      tags: [Cases]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Synthetische Sperrmüllregeln.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkWasteRules"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/bulk-waste/slots:
    get:
      operationId: getBulkWasteSlots
      summary: Liefert freie synthetische Sperrmülltermine.
      tags: [Cases]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/AddressIdQuery"
      responses:
        "200":
          description: Verfügbare Abholslots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkWasteSlot"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/bulk-waste/orders:
    post:
      operationId: createBulkWasteOrder
      summary: Beauftragt eine synthetische Sperrmüllabholung idempotent.
      tags: [Cases]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkWasteOrderInput"
      responses:
        "201":
          description: Sperrmüllvorgang wurde angenommen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseCreated"
        "200":
          description: Bereits idempotent angelegter Vorgang.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseCreated"
        "409":
          description: Slot oder fachliche Grenze ist nicht mehr verfügbar.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/recycling-access/requests:
    post:
      operationId: createRecyclingAccessRequest
      summary: Beantragt einen synthetischen, zeitgebundenen Zugang zum Demo-Recyclinghof.
      description: >-
        Pilotendpunkt ohne reale Kennzeichenerkennung oder Schrankenansteuerung. Kennzeichen
        müssen mit DEMO- beginnen; alle Scanner- und Torereignisse sind Simulationen.
      tags: [Recycling access]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecyclingAccessRequestInput"
      responses:
        "201":
          description: Synthetische Zufahrtsberechtigung wurde ausgestellt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecyclingAccessRequest"
        "200":
          description: Bereits idempotent angelegte Zufahrtsberechtigung; der Zugangscode wird nicht erneut ausgegeben.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecyclingAccessRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/recycling-access/requests/{reference}/simulation-events:
    post:
      operationId: simulateRecyclingAccessEvent
      summary: Führt genau ein synthetisches Scanner- oder Torereignis aus.
      description: >-
        Ausschließlich für den lokalen Showcase. Eine reale Hardwareintegration benötigt einen
        authentifizierten Gerätekanal, Safety-Sensorik und ein separates Threat Model.
      tags: [Recycling access]
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
            pattern: "^DEMO-Z-[A-F0-9]{12}$"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecyclingAccessSimulationInput"
      responses:
        "200":
          description: Aktualisierter Zustand der synthetischen Zufahrt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecyclingAccessRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Das Ereignis passt nicht zum aktuellen Zustand.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/cases/{reference}:
    get:
      operationId: getCase
      summary: Zeigt einen synthetischen Gastvorgang mit Zugriffsschlüssel.
      tags: [Cases]
      parameters:
        - $ref: "#/components/parameters/CaseReference"
        - name: accessToken
          in: query
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Öffentlicher Vorgangsstatus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/cases:
    get:
      operationId: getAdminCases
      summary: Listet synthetische Pilotvorgänge für die lokale Bearbeitung.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Vorgangsliste ohne Gastzugriffsschlüssel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/admin/cases/{reference}/status:
    patch:
      operationId: updateCaseStatus
      summary: Ändert den öffentlichen Status eines synthetischen Pilotvorgangs.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/CaseReference"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseStatusInput"
      responses:
        "200":
          description: Aktualisierter Vorgang.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ContentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TenantId:
      name: tenantId
      in: query
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        type: string
    AddressIdQuery:
      name: addressId
      in: query
      required: true
      schema:
        type: string
    CaseReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
        pattern: "^DEMO-[A-F0-9]{20}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 120
  responses:
    BadRequest:
      description: Eingaben sind unvollständig oder fachlich ungültig.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Die angeforderte Ressource ist nicht vorhanden.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - checkedAt
      properties:
        status:
          type: string
          const: ready
        checkedAt:
          type: string
          format: date-time
    Branding:
      type: object
      additionalProperties: false
      required:
        - logoUrl
        - primaryColor
        - infoColor
      properties:
        logoUrl:
          type: string
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        infoColor:
